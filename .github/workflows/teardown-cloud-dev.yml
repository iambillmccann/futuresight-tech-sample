name: Tear down cloud development

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pause stops App Runner compute but keeps secrets, images, and the public URL; destroy removes every app resource, including secret values."
        required: true
        type: choice
        default: pause
        options:
          - pause
          - destroy
      confirm:
        description: Required for destroy mode only. Type destroy to remove the environment and its data.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: reviewlens-cloud-dev
  cancel-in-progress: false

jobs:
  teardown:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'pause' || inputs.confirm == 'destroy')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize remote Terraform state
        working-directory: infra/providers/aws
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init \
            -backend-config="bucket=reviewlens-tfstate-${account_id}-${AWS_REGION}" \
            -backend-config="region=$AWS_REGION"

      - name: Pause cloud development compute
        if: inputs.mode == 'pause'
        working-directory: infra/providers/aws
        run: |
          terraform apply -auto-approve \
            -var="aws_region=$AWS_REGION" \
            -var="enable_backend=false"
          echo "Paused. Rerun 'Deploy cloud development' to resume at $(terraform output -raw frontend_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy cloud development resources
        if: inputs.mode == 'destroy'
        working-directory: infra/providers/aws
        run: terraform destroy -auto-approve -var="aws_region=$AWS_REGION"
